[metadata]
name = watchtower
version = attr: watchtower.__version__
description = Watchtower event collectors and source configuration
license = Apache-2.0

[options]
packages = find:
python_requires = >=3.8
install_requires =
    PyYAML>=5.4.1
    requests>=2.25

[options.packages.find]
include = watchtower*

[options.entry_points]
console_scripts =
    watchtower = watchtower.cli:main

[flake8]
max-line-length = 110
exclude = .git,__pycache__,build,dist

[tool:pytest]
testpaths = tests
