[project]
name = "watchtower"
version = "2.0.0"
description = "Watchtower event collectors and source configuration"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "EntSec Detection & Monitoring", email = "watchtower-team@kestrel.example" }]
dependencies = [
  "pyyaml>=6.0.2",
  "requests>=2.32.3",
]

[project.scripts]
watchtower = "watchtower.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3.4",
  "ruff>=0.8.4",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["watchtower"]

[tool.ruff]
line-length = 120
target-version = "py312"
# vendored from Flightpath; linted in its source repository
extend-exclude = [".github/scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
