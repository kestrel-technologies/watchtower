# Flightpath Gate 1 for watchtower: lint and unit tests.
# Status context: `ci` (required on develop, uat and main).
name: ci
on:
  pull_request: { branches: [develop, uat, main] }
  push: { branches: [develop, uat, main] }
permissions: { contents: read }
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@887a942a15af3a7626099df99e897a18d9e5ab3a # v5.1.0
        with: { python-version: '3.12' }
      - name: uv sync
        run: uv sync --locked
      - name: ruff
        run: uv run ruff check .
      - name: pytest
        run: uv run pytest
