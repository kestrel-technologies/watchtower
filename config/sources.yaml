# Watchtower event sources. Each source is collected by the named collector.
# Salesforce sources require the Event Monitoring add-on on the org (docs/salesforce.md).
sources:
  - id: kestrel-corp-prod
    type: salesforce
    collector: salesforce_eventlog
    login_url: https://kestrel-corp.my.salesforce.com
    events: [Login, Logout, API, ReportExport]
    interval_minutes: 10
    added: 2020-06-01
  - id: kestrel-cloud-sales-prod
    type: salesforce
    collector: salesforce_eventlog
    login_url: https://kestrel-cloud-sales.my.salesforce.com
    events: [Login, Logout, API, ReportExport]
    interval_minutes: 10
    added: 2021-09-13
  - id: kestrel-workspace
    type: workspace
    collector: workspace
    interval_minutes: 5
    added: 2020-04-20
  - id: roost
    type: github
    collector: github
    interval_minutes: 5
    added: 2020-05-04
